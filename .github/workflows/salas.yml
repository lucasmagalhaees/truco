name: Salas

# Deploys the room server (server/worker.ts, wrangler.toml) to Cloudflare when what it runs changes on main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID.
# Without them the job says so and stops, green: the app works without the server, only online play is off.
on:
  push:
    branches: [main]
    paths: ['server/**', 'src/core/**', 'wrangler.toml', '.github/workflows/salas.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salas
  cancel-in-progress: false

jobs:
  deploy:
    name: salas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Types of the room server
        run: npx tsc --noEmit -p server
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=salas::sem CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos secrets: o servidor de salas não foi publicado"
            exit 0
          fi
          npx -y wrangler@4.145.0 deploy
